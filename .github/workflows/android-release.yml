name: Build Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Validate LFS assets
        run: |
          fail=0
          for f in \
            android/app/src/main/assets/dictionary.db \
            android/app/libs/sherpa-onnx-1.13.7.aar \
            android/app/src/main/assets/tts/fr_FR-siwis-medium/fr_FR-siwis-medium.onnx; do
            size=$(stat -c%s "$f")
            echo "$f -> $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "ERROR: $f still an LFS placeholder (Git LFS object missing on server)"
              fail=1
            fi
          done
          exit $fail

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-36 build-tools;36.0.0'
          auto-accept-android-sdk-licenses: true

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src=android/app/build/outputs/apk/release/app-release.apk
          out="french_dict_${TAG}.apk"
          cp "$src" "$out"
          echo "APK size: $(stat -c%s "$out") bytes"
          gh release create "$TAG" "$out" \
            --title "$TAG" \
            --verify-tag \
            --target main \
            --notes "自动构建：GitHub Actions（查词动词搭配/固定组合展示）" \
            || { gh release upload "$TAG" "$out" --clobber; gh release edit "$TAG" --latest; }
