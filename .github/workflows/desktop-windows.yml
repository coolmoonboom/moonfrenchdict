name: Build Windows Desktop Preview

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Build app-image with bundled runtime
        working-directory: android
        run: .\gradlew.bat :desktop:createDistributable --no-daemon --max-workers=2

      - name: Package zip
        shell: pwsh
        run: |
          $bin = "android\desktop\build\compose\binaries\main"
          Get-ChildItem $bin -Recurse -Depth 2 | Select-Object FullName
          $src = @("$bin\app", "$bin\image") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { Write-Error "distributable image not found"; exit 1 }
          Compress-Archive -Path "$src\*" -DestinationPath moonfrench-desktop-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: moonfrench-desktop-windows-x64
          path: moonfrench-desktop-windows-x64.zip

      - name: Publish prerelease on tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} moonfrench-desktop-windows-x64.zip --prerelease --title "MoonFrench Dict desktop ${{ github.ref_name }}" --notes "Windows x64 桌面预览：查词、变位、中文候选。解压后运行 MoonFrenchDict.exe。"
